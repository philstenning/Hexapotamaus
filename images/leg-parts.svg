<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="780" height="470" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Hexapotamaus leg parts</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="780" height="470" rx="12" fill="#ffffff"/>

  <!-- Side view, drawn to scale (2 px per mm) in the default stance -->
  <text x="20" y="30" font-size="15" font-weight="bold" fill="#222">Side view (to scale, default stance)</text>

  <!-- ground -->
  <line x1="20" y1="392" x2="480" y2="392" stroke="#999" stroke-dasharray="6 4"/>
  <text x="24" y="410" fill="#777">ground</text>

  <!-- body -->
  <rect x="20" y="135" width="130" height="50" rx="6" fill="#eee" stroke="#888"/>
  <text x="60" y="165" fill="#444">Body</text>

  <!-- coxa yaw axis (vertical) -->
  <line x1="150" y1="95" x2="150" y2="225" stroke="#d9467a" stroke-dasharray="4 3"/>

  <!-- segments -->
  <line x1="150" y1="160" x2="250" y2="160" stroke="#d9467a" stroke-width="9" stroke-linecap="round"/>
  <line x1="250" y1="160" x2="423" y2="110" stroke="#3a7bd5" stroke-width="9" stroke-linecap="round"/>
  <line x1="423" y1="110" x2="410" y2="380" stroke="#2a9d6f" stroke-width="9" stroke-linecap="round"/>

  <!-- joints -->
  <circle cx="150" cy="160" r="9" fill="#fff" stroke="#d9467a" stroke-width="3"/>
  <circle cx="250" cy="160" r="9" fill="#fff" stroke="#3a7bd5" stroke-width="3"/>
  <circle cx="250" cy="160" r="2.5" fill="#3a7bd5"/>
  <circle cx="423" cy="110" r="9" fill="#fff" stroke="#2a9d6f" stroke-width="3"/>
  <circle cx="423" cy="110" r="2.5" fill="#2a9d6f"/>

  <!-- foot -->
  <circle cx="410" cy="384" r="8" fill="#555"/>
  <text x="426" y="388" fill="#222" font-weight="bold">Foot</text>
  <text x="426" y="404" fill="#555">sprung tip with the</text>
  <text x="426" y="419" fill="#555">foot contact switch</text>

  <!-- segment labels -->
  <text x="168" y="186" fill="#d9467a" font-weight="bold">Coxa</text>
  <text x="168" y="201" fill="#d9467a">50 mm</text>
  <text x="300" y="118" fill="#3a7bd5" font-weight="bold" transform="rotate(-16 300 118)">Femur 90 mm</text>
  <text x="430" y="250" fill="#2a9d6f" font-weight="bold">Tibia</text>
  <text x="430" y="265" fill="#2a9d6f">135 mm</text>

  <!-- joint labels -->
  <text x="40" y="70" fill="#d9467a" font-weight="bold">Coxa joint (hip)</text>
  <text x="40" y="86" fill="#555">axis vertical: swings the leg forward/back</text>
  <line x1="120" y1="90" x2="146" y2="150" stroke="#bbb"/>

  <text x="165" y="232" fill="#3a7bd5" font-weight="bold">Femur joint</text>
  <text x="165" y="248" fill="#555">axis horizontal: lifts the leg up/down</text>
  <line x1="240" y1="220" x2="249" y2="171" stroke="#bbb"/>
  <path d="M 228 140 A 30 30 0 0 1 272 140" fill="none" stroke="#555" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <text x="445" y="80" fill="#2a9d6f" font-weight="bold">Tibia joint (knee)</text>
  <text x="445" y="96" fill="#555">axis horizontal: moves the foot in/out</text>
  <line x1="450" y1="100" x2="431" y2="108" stroke="#bbb"/>
  <path d="M 401 128 A 30 30 0 0 0 445 128" fill="none" stroke="#555" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- Top view -->
  <text x="560" y="200" font-size="15" font-weight="bold" fill="#222">Top view</text>
  <rect x="560" y="215" width="40" height="150" rx="6" fill="#eee" stroke="#888"/>
  <text x="566" y="240" fill="#444" font-size="11">Body</text>
  <line x1="600" y1="290" x2="740" y2="290" stroke="#3a7bd5" stroke-width="9" stroke-linecap="round" opacity="0.35"/>
  <line x1="600" y1="290" x2="640" y2="290" stroke="#d9467a" stroke-width="9" stroke-linecap="round"/>
  <circle cx="600" cy="290" r="9" fill="#fff" stroke="#d9467a" stroke-width="3"/>
  <path d="M 712 240 A 115 115 0 0 1 712 340" fill="none" stroke="#555" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="560" y="390" fill="#555">The coxa joint turns the</text>
  <text x="560" y="406" fill="#555">whole leg about a vertical</text>
  <text x="560" y="422" fill="#555">axis, like a hip swinging.</text>
</svg>
